<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğrenci Not Sistemi</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#4facfe,#00f2fe);
        padding:20px;
    }

    .container{
        background:white;
        width:700px;
        max-width:100%;
        padding:25px;
        border-radius:15px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#333;
        margin-bottom:20px;
    }

    .form-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
    }

    input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#2196F3;
        color:white;
        font-size:18px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#0d8bf2;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    table th{
        background:#2196F3;
        color:white;
        padding:12px;
    }

    table td{
        padding:10px;
        text-align:center;
        border:1px solid #ddd;
    }

    tr:nth-child(even){
        background:#f2f2f2;
    }

    .basarili{
        color:green;
        font-weight:bold;
    }

    .basarisiz{
        color:red;
        font-weight:bold;
    }
</style>
</head>

<body>

<div class="container">

    <h1>📚 Öğrenci Not Hesaplama</h1>

    <div class="form-group">
        <label>Öğrenci Adı</label>
        <input type="text" id="ad">
    </div>

    <div class="form-group">
        <label>Vize Notu</label>
        <input type="number" id="vize" min="0" max="100">
    </div>

    <div class="form-group">
        <label>Final Notu</label>
        <input type="number" id="final" min="0" max="100">
    </div>

    <button onclick="hesapla()">Notu Hesapla</button>

    <table>
        <thead>
            <tr>
                <th>Öğrenci</th>
                <th>Vize</th>
                <th>Final</th>
                <th>Ortalama</th>
                <th>Harf Notu</th>
                <th>Durum</th>
            </tr>
        </thead>

        <tbody id="sonucTablosu">

        </tbody>
    </table>

</div>

<script>

function harfNotu(ortalama){
    if(ortalama >= 90) return "AA";
    if(ortalama >= 85) return "BA";
    if(ortalama >= 80) return "BB";
    if(ortalama >= 75) return "CB";
    if(ortalama >= 70) return "CC";
    if(ortalama >= 60) return "DC";
    if(ortalama >= 50) return "DD";
    return "FF";
}

function hesapla(){

    let ad = document.getElementById("ad").value;
    let vize = Number(document.getElementById("vize").value);
    let final = Number(document.getElementById("final").value);

    if(ad === "" || isNaN(vize) || isNaN(final)){
        alert("Lütfen tüm alanları doldurun!");
        return;
    }

    let ortalama = (vize * 0.4) + (final * 0.6);

    let harf = harfNotu(ortalama);

    let durum = ortalama >= 50
        ? '<span class="basarili">Geçti</span>'
        : '<span class="basarisiz">Kaldı</span>';

    let satir = `
        <tr>
            <td>${ad}</td>
            <td>${vize}</td>
            <td>${final}</td>
            <td>${ortalama.toFixed(2)}</td>
            <td>${harf}</td>
            <td>${durum}</td>
        </tr>
    `;

    document.getElementById("sonucTablosu").innerHTML += satir;

    document.getElementById("ad").value = "";
    document.getElementById("vize").value = "";
    document.getElementById("final").value = "";
}

</script>

</body>
</html>

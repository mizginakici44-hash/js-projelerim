<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Form İşlemleri</title>
</head>
<body>
    
    <form id="kullaniciFormu">
        <label for="adlnput">Adınız:</label>
        <input type="text" id="adlnput" placeholder="Adınızı giriniz..."required>
        <button type="submit">Gönder</button>
    </form>
      <h3 id="sonuc" ></h3>
    <script>
    const form = document.getElementById("kullaniciFormu");
    const adlnput = document.getElementById("adlnput");
    const sonuc = document.getElementById("sonuc");

    form.addEventListener("submit",function(e){
        e.preventDefault();
        const girilenAd = adlnput.value;

        sonuc.innerText= 'Merhaba,${girilenAd}! Form başarıyla işlendi.';
        adlnput.value="";
    });
    </script>
</body>
</html>

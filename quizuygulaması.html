<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Uygulaması</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.quiz-container{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
    color:#444;
}

.progress-container{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

#progressBar{
    height:100%;
    width:0%;
    background:#4CAF50;
    transition:.3s;
}

#question{
    margin-bottom:20px;
    color:#333;
    line-height:1.5;
}

.option{
    background:#f3f3f3;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#dbe4ff;
}

.option.selected{
    background:#8fb5ff;
    color:white;
}

button{
    width:100%;
    border:none;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#5568d8;
}

.result{
    text-align:center;
}

.result h2{
    margin-bottom:15px;
}

.result p{
    margin:10px 0;
}

.leaderboard{
    margin-top:20px;
    text-align:left;
}

.leaderboard ul{
    list-style:none;
}

.leaderboard li{
    padding:8px;
    border-bottom:1px solid #eee;
}

@media(max-width:480px){

    .quiz-container{
        padding:15px;
    }

    #question{
        font-size:18px;
    }

    .option{
        padding:12px;
        font-size:14px;
    }

    button{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="quiz-container">

    <div class="top-bar">
        <div>⏱ Süre: <span id="timer">15</span></div>
        <div>📖 Soru: <span id="questionNumber">1</span></div>
    </div>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <button id="nextBtn">
        Sonraki Soru
    </button>

</div>

<script>

const quizData = [

{
question:"HTML'in açılımı nedir?",
options:[
"Hyper Text Markup Language",
"Home Tool Markup Language",
"Hyper Tool Main Language",
"Hyper Transfer Markup Language"
],
answer:0
},

{
question:"CSS ne için kullanılır?",
options:[
"Veritabanı",
"Sunucu Yönetimi",
"Stil ve Tasarım",
"Programlama"
],
answer:2
},

{
question:"JavaScript hangi amaçla kullanılır?",
options:[
"Sayfaları Dinamik Yapmak",
"İşletim Sistemi Yazmak",
"Donanım Üretmek",
"Antivirüs Oluşturmak"
],
answer:0
},

{
question:"Türkiye'nin başkenti neresidir?",
options:[
"Van",
"İstanbul",
"Ankara",
"İzmir"
],
answer:2
},

{
question:"2026 sayısının yarısı kaçtır?",
options:[
"1013",
"1010",
"1200",
"1513"
],
answer:0
},

{
question:"Dünya'nın uydusu hangisidir?",
options:[
"Mars",
"Ay",
"Venüs",
"Jüpiter"
],
answer:1
}

];

quizData.sort(()=>Math.random()-0.5);

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;

let timeLeft = 15;
let timer;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const timerEl = document.getElementById("timer");

function updateProgress(){

const progress =
(currentQuestion/quizData.length)*100;

document.getElementById("progressBar")
.style.width = progress + "%";
}

function startTimer(){

clearInterval(timer);

timeLeft = 15;

timerEl.textContent = timeLeft;

timer = setInterval(()=>{

timeLeft--;

timerEl.textContent = timeLeft;

if(timeLeft <= 0){

clearInterval(timer);
nextQuestion();

}

},1000);

}

function loadQuestion(){

updateProgress();

document.getElementById("questionNumber").textContent =
currentQuestion + 1;

const q = quizData[currentQuestion];

questionEl.textContent = q.question;

optionsEl.innerHTML="";

selectedAnswer = null;

q.options.forEach((option,index)=>{

const div = document.createElement("div");

div.classList.add("option");

div.textContent = option;

div.addEventListener("click",()=>{

document.querySelectorAll(".option")
.forEach(item=>item.classList.remove("selected"));

div.classList.add("selected");

selectedAnswer = index;

});

optionsEl.appendChild(div);

});

startTimer();

}

function nextQuestion(){

clearInterval(timer);

if(selectedAnswer !== null){

if(selectedAnswer === quizData[currentQuestion].answer){

score++;

}

}

currentQuestion++;

if(currentQuestion < quizData.length){

loadQuestion();

}
else{

showResult();

}

}

nextBtn.addEventListener("click",()=>{

if(selectedAnswer === null){

alert("Bir seçenek seçiniz!");

return;

}

nextQuestion();

});

function getLevel(score){

if(score <= 2){
return "🥉 Başlangıç";
}

if(score <= 4){
return "🥈 Orta Seviye";
}

if(score <= 5){
return "🥇 İleri Seviye";
}

return "👑 Uzman";
}

function saveScore(name,score){

let scores =
JSON.parse(localStorage.getItem("quizScores")) || [];

scores.push({
name,
score
});

scores.sort((a,b)=>b.score-a.score);

scores = scores.slice(0,10);

localStorage.setItem(
"quizScores",
JSON.stringify(scores)
);

}

function generateLeaderboard(){

let scores =
JSON.parse(localStorage.getItem("quizScores")) || [];

let html = `
<div class="leaderboard">
<h3>🏆 Liderlik Tablosu</h3>
<ul>
`;

scores.forEach(player=>{

html += `
<li>
${player.name} - ${player.score}
</li>
`;

});

html += `
</ul>
</div>
`;

return html;

}

function showResult(){

updateProgress();

const playerName =
prompt("İsminizi girin:") || "Misafir";

saveScore(playerName,score);

document.querySelector(".quiz-container")
.innerHTML = `

<div class="result">

<h2>🎉 Quiz Tamamlandı</h2>

<p>
Doğru Sayısı:
<strong>${score}</strong>
/
${quizData.length}
</p>

<p>
Seviyeniz:
<strong>${getLevel(score)}</strong>
</p>

${generateLeaderboard()}

<button onclick="location.reload()">
🔄 Tekrar Oyna
</button>

</div>

`;

}

loadQuestion();

</script>

</body>
</html>

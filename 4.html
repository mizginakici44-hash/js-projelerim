<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width,initial-scale=1.0">
        <title>For Döngüsü Uygulaması</title>

    </head>
    <body>
        <script>
            let txt=prompt("Ekrana yazdırılacak matni giriniz:");
            let sayi=Number(prompt("Metnin kaç kez yazdırılacağını giriniz:(sayı):"));
            for (let dd=1; dd<= sayi; dd++);{
                document.write(dd+"."+txt+"<br>")
            }
        </script>
    </body>
</html>

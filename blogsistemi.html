<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Sistemi</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

.form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    resize:none;
    height:180px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
    color:white;
}

.search{
    margin-bottom:20px;
}

.blog-card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.blog-card h2{
    margin-bottom:10px;
}

.blog-card small{
    color:gray;
}

.blog-card p{
    margin:15px 0;
    line-height:1.7;
}

.action-buttons{
    display:flex;
    gap:10px;
}

.edit-btn{
    background:orange;
    color:white;
}

.delete-btn{
    background:red;
    color:white;
}

.empty{
    text-align:center;
    padding:20px;
    color:gray;
}

</style>
</head>
<body>

<header>
    <h1>📝PostHub</h1>
</header>

<div class="container">

    <div class="form">

        <input
            type="text"
            id="title"
            placeholder="Başlık">

        <input
            type="text"
            id="category"
            placeholder="Kategori">

        <textarea
            id="content"
            placeholder="İçerik"></textarea>

        <button
            class="add-btn"
            id="saveBtn">
            Yazıyı Kaydet
        </button>

    </div>

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Blog ara...">

    </div>

    <div id="blogList"></div>

</div>

<script>

class Blog {

    constructor(id,title,category,content,date){

        this.id=id;
        this.title=title;
        this.category=category;
        this.content=content;
        this.date=date;

    }

}

class Storage {

    static getPosts(){

        return JSON.parse(
            localStorage.getItem("posts")
        ) || [];
    }

    static savePosts(posts){

        localStorage.setItem(
            "posts",
            JSON.stringify(posts)
        );

    }

}

const titleInput =
document.getElementById("title");

const categoryInput =
document.getElementById("category");

const contentInput =
document.getElementById("content");

const saveBtn =
document.getElementById("saveBtn");

const blogList =
document.getElementById("blogList");

const searchInput =
document.getElementById("searchInput");

let editId = null;

function renderPosts(){

    const posts =
    [...Storage.getPosts()].reverse();

    blogList.innerHTML = "";

    if(posts.length === 0){

        blogList.innerHTML =
        '<div class="empty">Henüz blog yazısı yok.</div>';

        return;
    }

    posts.forEach(post=>{

        const card =
        document.createElement("div");

        card.className =
        "blog-card";

        card.innerHTML = `
            <h2>${post.title}</h2>

            <small>
                ${post.category}
                •
                ${post.date}
            </small>

            <p>${post.content}</p>

            <div class="action-buttons">

                <button
                class="edit-btn"
                onclick="editPost(${post.id})">

                Düzenle

                </button>

                <button
                class="delete-btn"
                onclick="deletePost(${post.id})">

                Sil

                </button>

            </div>
        `;

        blogList.appendChild(card);

    });

}

saveBtn.addEventListener("click",()=>{

    const title =
    titleInput.value.trim();

    const category =
    categoryInput.value.trim();

    const content =
    contentInput.value.trim();

    if(
        !title ||
        !category ||
        !content
    ){
        alert(
        "Lütfen tüm alanları doldurun."
        );
        return;
    }

    let posts =
    Storage.getPosts();

    if(editId !== null){

        posts =
        posts.map(post=>{

            if(post.id === editId){

                post.title =
                title;

                post.category =
                category;

                post.content =
                content;

            }

            return post;

        });

        editId = null;

        saveBtn.textContent =
        "Yazıyı Kaydet";

    }else{

        const newPost =
        new Blog(

            Date.now(),
            title,
            category,
            content,

            new Date()
            .toLocaleDateString("tr-TR")

        );

        posts.push(newPost);
    }

    Storage.savePosts(posts);

    titleInput.value = "";
    categoryInput.value = "";
    contentInput.value = "";

    renderPosts();

});

function deletePost(id){

    let posts =
    Storage.getPosts();

    posts =
    posts.filter(
        post => post.id !== id
    );

    Storage.savePosts(posts);

    renderPosts();
}

function editPost(id){

    const posts =
    Storage.getPosts();

    const post =
    posts.find(
        post => post.id === id
    );

    if(!post) return;

    titleInput.value =
    post.title;

    categoryInput.value =
    post.category;

    contentInput.value =
    post.content;

    editId = id;

    saveBtn.textContent =
    "Güncelle";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

searchInput.addEventListener(
"keyup",
function(){

    const keyword =
    this.value.toLowerCase();

    const cards =
    document.querySelectorAll(
    ".blog-card"
    );

    cards.forEach(card=>{

        const text =
        card.innerText.toLowerCase();

        card.style.display =
        text.includes(keyword)
        ? "block"
        : "none";

    });

});

document.addEventListener(
"DOMContentLoaded",
renderPosts
);

</script>

</body>
</html>

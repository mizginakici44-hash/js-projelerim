<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Do-While Döngüsü</title>
</head>
<body>
    
    <script>
        let sayi =1;
        do{
            console.log("Sayı:" + sayı);
            sayi++;

        } while (sayi<=5);
    </script>
</body>
</html>

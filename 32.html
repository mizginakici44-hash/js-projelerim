<!DOCTYPE html>
<html>
    <body>
        <script>
            let sayi;

            sayi = prompt("Haftanın kaçıncı günü?");
            sayi = parseInt(sayi);
            switch(sayi){
                case 1:
                    alert("Pazartesi");
                    break;

                    case 2:
                    alert("Salı");
                    break;

                    case 3:
                    alert("Çarşamba");
                    break;

                    case 4:
                    alert("Perşembe");
                    break;

                    case 5:
                    alert("Cuma");
                    break;

                    case 6:
                    alert("Cumartesi");
                    break;

                    case 7:
                    alert("Pazar");
                    break;
                     default:
                        alert("Böyle bir gün yok");
            }
        </script>
    </body>
</html>

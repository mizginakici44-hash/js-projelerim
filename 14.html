<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>sadece pozitif sayıların toplamı</title>
</head>
<body>
    
    <script>
        let sayilar =[-5,10,3,7,56,0,-8];
        let tolam =0;

        for(let i=0;i<sayilar.length;i++){
            if(sayilar[i]>0) {
                toplam += sayilar[i];
            }
        }
        console.log("pozitif sayıların toplamı:"+ toplam);
    </script>
</body>
</html>

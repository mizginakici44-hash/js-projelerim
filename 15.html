<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title> break - continue dongüsü</title>
</head>
<body>
    
    <script>
        for(let i= 1; i<=5;i++){
            if(i===3){
                 break;
            }
            console.log("Sayı(break):" + i);
        }
    </script>
</body>
</html>
